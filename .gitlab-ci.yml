image: docker:latest

services:
  - docker:dind

stages:
  - update

update:
  stage: update
  script:
    - apk add --no-cache openssh-client
    - cd ..
    - mkdir ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh -i ~/.ssh/id_rsa -oStrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "echo 'Copying Repository'"
    - scp -r synsteg $SERVER_USER@$SERVER_IP:/root/
    - ssh -i ~/.ssh/id_rsa -oStrictHostKeyChecking=no $SERVER_USER@$SERVER_IP 'cd synsteg && docker-compose up -d --build'
